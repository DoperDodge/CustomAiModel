# ============================================================
# Custom AI Model — Master Configuration
# ============================================================
# Copy this file and adjust for your hardware and use case.
# Environment variables override these settings (prefix: CUSTOM_AI_)

# --- Text-to-Text (LLM) ---
text_to_text:
  # Pre-trained base model (HuggingFace ID or local path)
  base_model: "microsoft/Phi-3-mini-4k-instruct"

  # LoRA fine-tuning config
  lora:
    rank: 32
    alpha: 64
    dropout: 0.05
    target_modules:
      - qkv_proj
      - o_proj
      - gate_up_proj
      - down_proj

  # General training
  training:
    dataset: "tatsu-lab/alpaca"
    epochs: 3
    batch_size: 2
    gradient_accumulation_steps: 8
    learning_rate: 2.0e-4
    max_seq_length: 2048
    warmup_ratio: 0.05
    scheduler: cosine
    bf16: true
    gradient_checkpointing: true

  # Reasoning fine-tuning (train_reasoning.py)
  reasoning:
    datasets:                    # Which reasoning datasets to train on
      - gsm8k                    # 8.5K grade-school math problems
      - metamath                 # 395K math with detailed solutions (sampled)
    output_dir: "./checkpoints/t2t-reasoning"
    epochs: 3
    batch_size: 1                # Keep low for 8GB GPUs
    gradient_accumulation_steps: 16
    learning_rate: 1.0e-4        # Slightly lower LR for reasoning
    max_seq_length: 2048
    max_samples_per_dataset: 10000  # Cap large datasets
    quantize: true               # QLoRA — required for 8GB VRAM
    seed: 42

  # Inference
  inference:
    max_tokens: 256
    temperature: 0.7
    top_p: 0.9
    top_k: 50
    quantization: "int4"  # "int4", "int8", or null for full precision

# --- Text-to-Speech ---
text_to_speech:
  engine: "auto"  # "auto", "piper", "edge", "espeak", or "pyttsx3" — auto tries piper → edge → espeak → pyttsx3
  voice: "en_US-lessac-medium"   # Piper voice name (ignored when using espeak)
  edge_voice: "en-US-AriaNeural" # Edge TTS voice (run: python -m edge_tts --list-voices)
  espeak_voice: "en"             # espeak-ng voice (used when engine is espeak or auto-fallback)
  sample_rate: 22050
  length_scale: 1.0       # Speaking speed (>1 = slower, <1 = faster)
  noise_scale: 0.667      # Expressiveness (Piper only)
  noise_w: 0.8            # Phoneme duration variation (Piper only)

# --- Speech-to-Speech ---
speech_to_speech:
  asr:
    model: "base"          # Whisper model size: tiny, base, small, medium, large-v3
    language: "en"
    device: "cuda"
  llm:
    model: "microsoft/Phi-3-mini-4k-instruct"
    max_tokens: 256
    temperature: 0.7
  tts:
    voice: "en_US-lessac-medium"
  pipeline:
    vad_threshold: 0.5
    sentence_delimiters: ".!?\n"
    audio_chunk_duration: 0.5

# --- Image Generation ---
# Many SD models are gated on HuggingFace now. Run: huggingface-cli login
# Or set HF_TOKEN env var. The system will auto-try fallback models.
image_generation:
  model: "stable-diffusion-v1-5/stable-diffusion-v1-5"
  device: "auto"             # auto, cuda, or cpu
  dtype: "float16"
  default_width: 512
  default_height: 512
  num_inference_steps: 30
  guidance_scale: 7.5
  safety_checker: true
  lora_weights: null         # Path to custom LoRA weights
  hf_token: null             # Or set HF_TOKEN env var

# --- API Server ---
api:
  host: "0.0.0.0"
  port: 8000
  workers: 1               # Keep at 1 for GPU models
  cors_origins:
    - "http://localhost:3000"

# --- Safety ---
safety:
  input_filter: true
  output_filter: true
  nsfw_image_filter: true
  max_response_length: 4096

# --- RAG (Retrieval-Augmented Generation) ---
rag:
  vector_store:
    backend: "chromadb"         # chromadb (only option for now)
    persist_path: "./data/vectordb"  # Set to null for ephemeral (in-memory)
    collection_name: "documents"
    similarity_metric: "cosine" # cosine, l2, or ip (inner product)
  ingestion:
    chunk_size: 512            # Max characters per chunk
    chunk_overlap: 64          # Overlapping chars between chunks
    chunk_strategy: "recursive" # "recursive" (paragraph→sentence→word) or "fixed"
    supported_formats:         # File types the loader handles
      - ".txt"
      - ".md"
      - ".json"
      - ".csv"
      - ".pdf"
      - ".html"
  search:
    n_results: 5               # Number of chunks to retrieve per query
    min_score: 0.3             # Minimum similarity score to include
  web_search:
    enabled: true
    engine: "duckduckgo"       # duckduckgo (only option for now, free, no API key)
    max_results: 3             # Max results returned after filtering
    allowed_tlds:              # Only allow results from these TLDs
      - ".gov"
      - ".net"
      - ".org"
      - ".edu"
    allowed_domains:           # Also allow these specific domains
      - "reddit.com"
      - "stackoverflow.com"
      - "github.com"

# --- Resource Management ---
resources:
  max_loaded_models: 2     # Max models in GPU memory simultaneously
  lazy_loading: true       # Load models on first request
  cpu_offload: true        # Move idle models to CPU RAM
  gpu_memory_fraction: 0.9 # Max fraction of GPU memory to use
