<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Custom AI Model</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; background: #1a1a2e; color: #e0e0e0; height: 100vh; display: flex; flex-direction: column; }
  header { background: #16213e; padding: 16px 24px; border-bottom: 1px solid #0f3460; display: flex; align-items: center; gap: 12px; }
  header h1 { font-size: 18px; font-weight: 600; color: #e94560; }
  header span { font-size: 13px; color: #888; }
  #chat { flex: 1; overflow-y: auto; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
  .msg { max-width: 75%; padding: 12px 16px; border-radius: 12px; line-height: 1.5; font-size: 14px; white-space: pre-wrap; word-wrap: break-word; }
  .msg.user { align-self: flex-end; background: #0f3460; color: #fff; border-bottom-right-radius: 4px; }
  .msg.assistant { align-self: flex-start; background: #222; color: #ddd; border-bottom-left-radius: 4px; position: relative; }
  .msg.error { align-self: center; background: #4a1525; color: #f88; font-size: 13px; }
  .typing { align-self: flex-start; color: #888; font-size: 13px; padding: 8px 16px; }
  .tts-btn { background: none; border: none; color: #888; cursor: pointer; font-size: 16px; padding: 4px 6px; margin-left: 4px; border-radius: 4px; vertical-align: middle; }
  .tts-btn:hover { color: #e94560; background: rgba(233,69,96,0.1); }
  .tts-btn.playing { color: #e94560; }
  .tts-btn:disabled { color: #555; cursor: not-allowed; }
  .msg-content { display: inline; }
  .msg-footer { display: flex; justify-content: flex-end; margin-top: 6px; }
  #input-area { background: #16213e; padding: 16px 24px; border-top: 1px solid #0f3460; display: flex; gap: 12px; align-items: flex-end; }
  #input-area textarea { flex: 1; background: #1a1a2e; color: #e0e0e0; border: 1px solid #333; border-radius: 8px; padding: 10px 14px; font-size: 14px; font-family: inherit; resize: none; outline: none; min-height: 44px; max-height: 120px; }
  #input-area textarea:focus { border-color: #e94560; }
  #input-area button { background: #e94560; color: #fff; border: none; border-radius: 8px; padding: 0 20px; font-size: 14px; font-weight: 600; cursor: pointer; white-space: nowrap; min-height: 44px; }
  #input-area button:hover { background: #c73652; }
  #input-area button:disabled { background: #555; cursor: not-allowed; }
  #img-btn { background: none; border: 1px solid #333; border-radius: 8px; color: #888; font-size: 20px; padding: 0 12px; min-height: 44px; cursor: pointer; display: flex; align-items: center; }
  #img-btn:hover { color: #e94560; border-color: #e94560; }
  #mic-btn { background: none; border: 1px solid #333; border-radius: 8px; color: #888; font-size: 20px; padding: 0 12px; min-height: 44px; cursor: pointer; display: flex; align-items: center; }
  #mic-btn:hover { color: #e94560; border-color: #e94560; }
  #mic-btn.recording { color: #fff; background: #e94560; border-color: #e94560; animation: pulse 1.5s infinite; }
  #mic-btn:disabled { color: #555; border-color: #333; cursor: not-allowed; animation: none; }
  @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.6; } }
  .gen-img { max-width: 100%; border-radius: 8px; margin-top: 8px; cursor: pointer; }
  .gen-img:hover { opacity: 0.9; }
  .img-prompt { font-size: 12px; color: #888; margin-bottom: 4px; }
  .progress-bar { width: 100%; height: 4px; background: #333; border-radius: 2px; margin-top: 8px; overflow: hidden; }
  .progress-bar .fill { height: 100%; background: #e94560; border-radius: 2px; animation: indeterminate 1.5s infinite; }
  @keyframes indeterminate { 0% { width: 0%; margin-left: 0; } 50% { width: 60%; margin-left: 20%; } 100% { width: 0%; margin-left: 100%; } }
</style>
</head>
<body>
<header>
  <h1>Custom AI Model</h1>
  <span>Phi-3 Mini 3.8B &mdash; localhost:8000</span>
</header>
<div id="chat"></div>
<div id="input-area">
  <textarea id="msg" rows="1" placeholder="Type a message..." autofocus></textarea>
  <button id="img-btn" title="Generate image">🖼️</button>
  <button id="mic-btn" title="Hold to talk">&#x1f3a4;</button>
  <button id="send" onclick="send()">Send</button>
</div>
<script>
const chat = document.getElementById('chat');
const msgInput = document.getElementById('msg');
const sendBtn = document.getElementById('send');
let history = [];

msgInput.addEventListener('keydown', e => {
  if (e.key === 'Enter' && !e.shiftKey) { e.preventDefault(); send(); }
});

// Image generation button — prefills /image into the input
document.getElementById('img-btn').addEventListener('click', () => {
  if (!msgInput.value.startsWith('/image ')) {
    msgInput.value = '/image ' + msgInput.value;
  }
  msgInput.focus();
  // Place cursor at end
  msgInput.selectionStart = msgInput.selectionEnd = msgInput.value.length;
});

// Auto-resize textarea
msgInput.addEventListener('input', () => {
  msgInput.style.height = 'auto';
  msgInput.style.height = Math.min(msgInput.scrollHeight, 120) + 'px';
});

let currentAudio = null;

function addMsg(role, text) {
  const div = document.createElement('div');
  div.className = 'msg ' + role;

  const content = document.createElement('span');
  content.className = 'msg-content';
  content.textContent = text;
  div.appendChild(content);

  if (role === 'assistant') {
    const footer = document.createElement('div');
    footer.className = 'msg-footer';
    const btn = document.createElement('button');
    btn.className = 'tts-btn';
    btn.innerHTML = '&#x1f50a;';
    btn.title = 'Read aloud';
    btn.onclick = () => playTTS(text, btn);
    footer.appendChild(btn);
    div.appendChild(footer);
  }

  chat.appendChild(div);
  chat.scrollTop = chat.scrollHeight;
  return div;
}

async function playTTS(text, btn) {
  // Stop if already playing
  if (currentAudio) {
    currentAudio.pause();
    currentAudio = null;
    document.querySelectorAll('.tts-btn.playing').forEach(b => b.classList.remove('playing'));
    return;
  }

  btn.disabled = true;
  btn.classList.add('playing');

  try {
    const resp = await fetch('/v1/audio/speech', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ input: text })
    });

    if (!resp.ok) throw new Error('TTS request failed');

    const blob = await resp.blob();
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    currentAudio = audio;

    audio.onended = () => {
      btn.classList.remove('playing');
      currentAudio = null;
      URL.revokeObjectURL(url);
    };

    audio.onerror = () => {
      btn.classList.remove('playing');
      currentAudio = null;
      URL.revokeObjectURL(url);
    };

    await audio.play();
  } catch (e) {
    btn.classList.remove('playing');
    console.error('TTS error:', e);
  }

  btn.disabled = false;
}

async function send() {
  const text = msgInput.value.trim();
  if (!text) return;

  msgInput.value = '';
  msgInput.style.height = 'auto';
  sendBtn.disabled = true;

  // Route /image commands to image generation
  if (text.startsWith('/image ')) {
    const prompt = text.slice(7).trim();
    if (prompt) {
      addMsg('user', text);
      await generateImage(prompt);
      sendBtn.disabled = false;
      msgInput.focus();
      return;
    }
  }

  addMsg('user', text);
  history.push({ role: 'user', content: text });

  const typingDiv = document.createElement('div');
  typingDiv.className = 'typing';
  typingDiv.textContent = 'Thinking...';
  chat.appendChild(typingDiv);
  chat.scrollTop = chat.scrollHeight;

  try {
    const resp = await fetch('/v1/chat/completions', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ messages: history, max_tokens: 512, stream: true })
    });

    chat.removeChild(typingDiv);

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      addMsg('error', 'Error: ' + (err.detail || resp.statusText));
      sendBtn.disabled = false;
      return;
    }

    // Create the assistant message bubble and stream tokens into it
    const msgDiv = addMsg('assistant', '');
    const contentSpan = msgDiv.querySelector('.msg-content');
    let fullReply = '';

    const reader = resp.body.getReader();
    const decoder = new TextDecoder();
    let buffer = '';

    while (true) {
      const { done, value } = await reader.read();
      if (done) break;

      buffer += decoder.decode(value, { stream: true });
      const lines = buffer.split('\n');
      buffer = lines.pop();  // keep incomplete line in buffer

      for (const line of lines) {
        const trimmed = line.trim();
        if (!trimmed || !trimmed.startsWith('data: ')) continue;
        const payload = trimmed.slice(6);
        if (payload === '[DONE]') break;

        try {
          const chunk = JSON.parse(payload);
          const token = chunk.choices?.[0]?.delta?.content;
          if (token) {
            fullReply += token;
            contentSpan.textContent = fullReply;
            chat.scrollTop = chat.scrollHeight;
          }
        } catch {}
      }
    }

    // Update TTS button to use the full reply text
    const ttsBtn = msgDiv.querySelector('.tts-btn');
    if (ttsBtn) ttsBtn.onclick = () => playTTS(fullReply, ttsBtn);

    history.push({ role: 'assistant', content: fullReply });
  } catch (e) {
    if (chat.contains(typingDiv)) chat.removeChild(typingDiv);
    addMsg('error', 'Connection error: ' + e.message);
  }

  sendBtn.disabled = false;
  msgInput.focus();
}

// ──────────────────────────────────────────────
// Image Generation
// ──────────────────────────────────────────────
async function generateImage(prompt) {
  const msgDiv = document.createElement('div');
  msgDiv.className = 'msg assistant';

  const label = document.createElement('div');
  label.className = 'img-prompt';
  label.textContent = 'Generating: ' + prompt;
  msgDiv.appendChild(label);

  const progressBar = document.createElement('div');
  progressBar.className = 'progress-bar';
  progressBar.innerHTML = '<div class="fill"></div>';
  msgDiv.appendChild(progressBar);

  chat.appendChild(msgDiv);
  chat.scrollTop = chat.scrollHeight;

  try {
    const resp = await fetch('/v1/images/generations', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ prompt: prompt, size: '512x512' })
    });

    msgDiv.removeChild(progressBar);

    if (!resp.ok) {
      const err = await resp.json().catch(() => ({}));
      label.textContent = 'Image generation failed';
      label.style.color = '#f88';
      const errMsg = document.createElement('div');
      errMsg.style.cssText = 'font-size:12px;color:#f88;margin-top:4px;';
      errMsg.textContent = err.detail || resp.statusText;
      msgDiv.appendChild(errMsg);
      return;
    }

    const data = await resp.json();
    label.textContent = prompt;

    for (const item of data.data) {
      if (item.b64_json) {
        const img = document.createElement('img');
        img.className = 'gen-img';
        img.src = 'data:image/png;base64,' + item.b64_json;
        img.alt = prompt;
        img.title = 'Click to open full size';
        img.onclick = () => {
          const w = window.open();
          w.document.write(`<img src="${img.src}" style="max-width:100%">`);
          w.document.title = prompt;
        };
        msgDiv.appendChild(img);
      }
    }

    chat.scrollTop = chat.scrollHeight;
  } catch (e) {
    msgDiv.removeChild(progressBar);
    label.textContent = 'Image generation error';
    label.style.color = '#f88';
    const errMsg = document.createElement('div');
    errMsg.style.cssText = 'font-size:12px;color:#f88;margin-top:4px;';
    errMsg.textContent = e.message;
    msgDiv.appendChild(errMsg);
  }
}

// ──────────────────────────────────────────────
// Microphone / Speech-to-Speech
// ──────────────────────────────────────────────
const micBtn = document.getElementById('mic-btn');
let mediaRecorder = null;
let isRecording = false;

micBtn.addEventListener('click', async () => {
  if (isRecording) {
    stopRecording();
  } else {
    await startRecording();
  }
});

async function startRecording() {
  try {
    const stream = await navigator.mediaDevices.getUserMedia({
      audio: { sampleRate: 16000, channelCount: 1, echoCancellation: true }
    });

    isRecording = true;
    micBtn.classList.add('recording');
    micBtn.title = 'Click to stop';
    sendBtn.disabled = true;

    // Use AudioContext to get raw PCM at 16kHz
    const audioCtx = new AudioContext({ sampleRate: 16000 });
    const source = audioCtx.createMediaStreamSource(stream);
    const processor = audioCtx.createScriptProcessor(4096, 1, 1);
    const chunks = [];

    processor.onaudioprocess = (e) => {
      if (!isRecording) return;
      const float32 = e.inputBuffer.getChannelData(0);
      // Convert float32 to int16
      const int16 = new Int16Array(float32.length);
      for (let i = 0; i < float32.length; i++) {
        int16[i] = Math.max(-32768, Math.min(32767, Math.round(float32[i] * 32768)));
      }
      chunks.push(int16);
    };

    source.connect(processor);
    processor.connect(audioCtx.destination);

    // Store references for cleanup
    micBtn._stream = stream;
    micBtn._audioCtx = audioCtx;
    micBtn._processor = processor;
    micBtn._source = source;
    micBtn._chunks = chunks;
  } catch (e) {
    console.error('Mic access denied:', e);
    addMsg('error', 'Microphone access denied. Please allow microphone access.');
  }
}

function stopRecording() {
  isRecording = false;
  micBtn.classList.remove('recording');
  micBtn.title = 'Hold to talk';
  micBtn.disabled = true;

  const stream = micBtn._stream;
  const audioCtx = micBtn._audioCtx;
  const processor = micBtn._processor;
  const source = micBtn._source;
  const chunks = micBtn._chunks;

  // Stop media
  processor.disconnect();
  source.disconnect();
  stream.getTracks().forEach(t => t.stop());
  audioCtx.close();

  if (!chunks.length) {
    micBtn.disabled = false;
    sendBtn.disabled = false;
    return;
  }

  // Combine all chunks into one buffer
  const totalLen = chunks.reduce((sum, c) => sum + c.length, 0);
  const fullAudio = new Int16Array(totalLen);
  let offset = 0;
  for (const c of chunks) {
    fullAudio.set(c, offset);
    offset += c.length;
  }

  // Send to server via WebSocket
  sendSpeech(fullAudio);
}

async function sendSpeech(audioData) {
  const typingDiv = document.createElement('div');
  typingDiv.className = 'typing';
  typingDiv.textContent = 'Listening...';
  chat.appendChild(typingDiv);
  chat.scrollTop = chat.scrollHeight;

  try {
    const protocol = location.protocol === 'https:' ? 'wss:' : 'ws:';
    const ws = new WebSocket(`${protocol}//${location.host}/v1/audio/conversation`);

    ws.binaryType = 'arraybuffer';

    ws.onopen = () => {
      // Send audio in chunks
      const CHUNK_SIZE = 8000; // ~0.5s at 16kHz
      for (let i = 0; i < audioData.length; i += CHUNK_SIZE) {
        const slice = audioData.slice(i, i + CHUNK_SIZE);
        ws.send(slice.buffer);
      }
      // Signal end of speech
      ws.send(JSON.stringify({ type: 'end_of_speech' }));
      typingDiv.textContent = 'Thinking...';
    };

    let responseText = '';
    let msgDiv = null;
    const audioQueue = [];
    let expectedAudioType = 'audio/wav';

    ws.onmessage = async (event) => {
      if (typeof event.data === 'string') {
        const msg = JSON.parse(event.data);

        if (msg.type === 'transcript') {
          // Show what the user said
          if (chat.contains(typingDiv)) chat.removeChild(typingDiv);
          addMsg('user', msg.text);
          history.push({ role: 'user', content: msg.text });

          // Create assistant bubble
          msgDiv = addMsg('assistant', '');
          typingDiv.textContent = 'Speaking...';
          chat.appendChild(typingDiv);
        }
        else if (msg.type === 'audio') {
          expectedAudioType = msg.media_type || 'audio/wav';
        }
        else if (msg.type === 'response_text') {
          responseText = msg.text;
          if (msgDiv) {
            msgDiv.querySelector('.msg-content').textContent = responseText;
            const ttsBtn = msgDiv.querySelector('.tts-btn');
            if (ttsBtn) ttsBtn.onclick = () => playTTS(responseText, ttsBtn);
          }
          history.push({ role: 'assistant', content: responseText });
        }
        else if (msg.type === 'end_of_response') {
          if (chat.contains(typingDiv)) chat.removeChild(typingDiv);
          // Play queued audio
          for (const audioBlob of audioQueue) {
            await playAudioBlob(audioBlob);
          }
          ws.close();
          micBtn.disabled = false;
          sendBtn.disabled = false;
        }
      } else {
        // Binary audio data
        const blob = new Blob([event.data], { type: expectedAudioType });
        audioQueue.push(blob);
      }
    };

    ws.onerror = (e) => {
      console.error('WebSocket error:', e);
      if (chat.contains(typingDiv)) chat.removeChild(typingDiv);
      addMsg('error', 'Speech connection error');
      micBtn.disabled = false;
      sendBtn.disabled = false;
    };

    ws.onclose = () => {
      micBtn.disabled = false;
      sendBtn.disabled = false;
    };
  } catch (e) {
    if (chat.contains(typingDiv)) chat.removeChild(typingDiv);
    addMsg('error', 'Speech error: ' + e.message);
    micBtn.disabled = false;
    sendBtn.disabled = false;
  }
}

function playAudioBlob(blob) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(blob);
    const audio = new Audio(url);
    audio.onended = () => { URL.revokeObjectURL(url); resolve(); };
    audio.onerror = () => { URL.revokeObjectURL(url); resolve(); };
    audio.play();
  });
}
</script>
</body>
</html>
